name: Build and release Mewtype

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch, tag, or commit
        type: string
        required: true
        default: main
      tag:
        description: Release tag. Leave empty for nightly+<short SHA>.
        type: string
        required: false
      expires_in_one_week:
        description: Expire seven days after the workflow starts
        type: boolean
        default: false
      upload_target:
        description: Distribution target
        type: choice
        required: true
        default: telegram-only
        options:
          - release-only
          - telegram-only
          - both

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      revision: ${{ steps.metadata.outputs.revision }}
      version: ${{ steps.metadata.outputs.version }}
      release_epoch: ${{ steps.metadata.outputs.release_epoch }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: It-s-bilibili-ticket-golang/bilibili-ticket-mewtype
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.CHECKOUT_TOKEN || github.token }}
          persist-credentials: false

      - name: Resolve build metadata
        id: metadata
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EXPIRES_IN_ONE_WEEK: ${{ inputs.expires_in_one_week }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          revision="$(git rev-parse HEAD)"
          version="${INPUT_TAG:-nightly+${revision:0:7}}"
          if [[ ! "$version" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]] ||
             ! git check-ref-format "refs/tags/$version"; then
            echo "::error::Invalid release tag"
            exit 1
          fi

          release_epoch=""
          if [[ "$EXPIRES_IN_ONE_WEEK" == "true" ]]; then
            started_at="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/1" \
              --jq '.run_started_at')"
            [[ -n "$started_at" && "$started_at" != "null" ]]
            release_epoch="$(date -u -d "$started_at" +%s)"
          fi

          {
            echo "revision=$revision"
            echo "version=$version"
            echo "release_epoch=$release_epoch"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-amd64
            target: x86_64-unknown-linux-gnu
            ext: ""
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            target: aarch64-unknown-linux-gnu
            ext: ""
          - runner: windows-2022
            platform: windows-amd64
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - runner: macos-15-intel
            platform: macos-amd64
            target: x86_64-apple-darwin
            ext: ""
          - runner: macos-15
            platform: macos-arm64
            target: aarch64-apple-darwin
            ext: ""
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: "1.98.1"
      CARGO_TERM_COLOR: always
      PYTHONDONTWRITEBYTECODE: "1"
      BILIBILI_RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Check out Mewtype
        uses: actions/checkout@v5
        with:
          repository: It-s-bilibili-ticket-golang/bilibili-ticket-mewtype
          ref: ${{ needs.resolve.outputs.revision }}
          token: ${{ secrets.CHECKOUT_TOKEN || github.token }}
          persist-credentials: false
          path: source

      - name: Check out Lyra
        uses: actions/checkout@v5
        with:
          repository: hakaioffsec/lyra
          ref: ${{ vars.LYRA_REF || 'main' }}
          persist-credentials: false
          path: lyra

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Set up Rust and LLVM 22
        if: ${{ matrix.target != 'aarch64-unknown-linux-gnu' && matrix.target != 'x86_64-apple-darwin' }}
        working-directory: lyra
        env:
          LYRA_CI_EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          python scripts/setup_ci.py

      - name: Set up Rust and LLVM 22 on macOS Intel
        if: ${{ matrix.target == 'x86_64-apple-darwin' }}
        shell: bash
        run: |
          set -euo pipefail

          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc -vV | grep -Fx 'host: x86_64-apple-darwin'

          brew install llvm@22
          llvm_prefix="$(brew --prefix llvm@22)"
          for tool in llc clang llvm-ar; do
            test -x "$llvm_prefix/bin/$tool"
          done
          "$llvm_prefix/bin/llc" --version

          {
            echo "LLVM_SYS_221_PREFIX=$llvm_prefix"
            echo "LYRA_LLVM_BIN=$llvm_prefix/bin"
          } >> "$GITHUB_ENV"

      - name: Set up Rust and LLVM 22 on Linux ARM64
        if: ${{ matrix.target == 'aarch64-unknown-linux-gnu' }}
        run: |
          set -euo pipefail

          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup target add aarch64-unknown-linux-gnu --toolchain "$RUSTUP_TOOLCHAIN"
          rustc -vV | grep -Fx 'host: aarch64-unknown-linux-gnu'

          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/install-llvm.sh"
          sudo bash "$RUNNER_TEMP/install-llvm.sh" 22
          sudo apt-get install -y llvm-22 llvm-22-dev clang-22

          llvm_prefix=/usr/lib/llvm-22
          for tool in llc clang llvm-ar; do
            test -x "$llvm_prefix/bin/$tool"
          done

          {
            echo "LLVM_SYS_221_PREFIX=$llvm_prefix"
            echo "LYRA_LLVM_BIN=$llvm_prefix/bin"
          } >> "$GITHUB_ENV"

      - name: Verify LLVM Polly on Linux
        if: ${{ runner.os == 'Linux' }}
        run: |
          set -euo pipefail
          llvm_prefix="${LLVM_SYS_221_PREFIX:-/usr/lib/llvm-22}"
          llvm_config="$llvm_prefix/bin/llvm-config"
          llvm_libdir="$("$llvm_config" --libdir)"
          if [[ ! -f "$llvm_libdir/libPolly.a" ]]; then
            sudo apt-get update
            sudo apt-get install -y libpolly-22-dev
            llvm_libdir="$("$llvm_config" --libdir)"
          fi
          test -f "$llvm_libdir/libPolly.a"

      - name: Build Lyra
        working-directory: lyra
        run: |
          set -euo pipefail
          cargo build --locked --release --bins

      #- name: Run the existing release packager
      #  working-directory: source
      #  env:
      #    TELEMETRY_DSN: ${{ secrets.TELEMETRY_DSN }}
      #    TELEMETRY_PINNED_SPKI_SHA256: ${{ secrets.TELEMETRY_PINNED_SPKI_SHA256 }}
      #    TELEMETRY_ENROLLMENT_KEY: ${{ secrets.TELEMETRY_ENROLLMENT_KEY }}
      #  run: |
      #    set -euo pipefail
      #    : "${TELEMETRY_DSN:?Missing TELEMETRY_DSN}"
      #    : "${TELEMETRY_PINNED_SPKI_SHA256:?Missing TELEMETRY_PINNED_SPKI_SHA256}"
      #    : "${TELEMETRY_ENROLLMENT_KEY:?Missing TELEMETRY_ENROLLMENT_KEY}"
#
      #    unset BILIBILI_RELEASE_EPOCH
      #    python tooling/package-release.py \
      #      "$RUNNER_TEMP/mewtype-reference" --edition public

      - name: Enable AES assembly for Lyra on Linux ARM64
        if: ${{ matrix.target == 'aarch64-unknown-linux-gnu' }}
        shell: bash
        run: |
          set -euo pipefail

          llvm_bin="${LYRA_LLVM_BIN:-/usr/lib/llvm-22/bin}"
          wrapper_bin="$(mktemp -d "$RUNNER_TEMP/lyra-llvm.XXXXXX")"
          ln -s "$llvm_bin/llc" "$wrapper_bin/llc"
          ln -s "$llvm_bin/llvm-ar" "$wrapper_bin/llvm-ar"

          cat > "$wrapper_bin/clang" <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          for arg in "$@"; do
            if [[ "$arg" == *.s ]]; then
              exec "$LYRA_REAL_CLANG" -march=armv8-a+aes "$@"
            fi
          done
          exec "$LYRA_REAL_CLANG" "$@"
          BASH
          chmod +x "$wrapper_bin/clang"

          export LYRA_REAL_CLANG="$llvm_bin/clang"
          printf '.text\n aesimc v0.16b, v0.16b\n' > "$wrapper_bin/check.s"
          "$wrapper_bin/clang" --target=aarch64-unknown-linux-gnu \
            -c "$wrapper_bin/check.s" -o "$wrapper_bin/check.o"

          {
            echo "LYRA_REAL_CLANG=$LYRA_REAL_CLANG"
            echo "LYRA_LLVM_BIN=$wrapper_bin"
          } >> "$GITHUB_ENV"
          
      - name: Build and archive obfuscated binaries
        working-directory: source
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          EXE_EXT: ${{ matrix.ext }}
          VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_EPOCH: ${{ needs.resolve.outputs.release_epoch }}
          EXPIRES_IN_ONE_WEEK: ${{ inputs.expires_in_one_week }}
          TELEMETRY_DSN: ${{ secrets.TELEMETRY_DSN }}
          TELEMETRY_PINNED_SPKI_SHA256: ${{ secrets.TELEMETRY_PINNED_SPKI_SHA256 }}
          TELEMETRY_ENROLLMENT_KEY: ${{ secrets.TELEMETRY_ENROLLMENT_KEY }}
        run: |
          set -euo pipefail

          unset BILIBILI_RELEASE_EPOCH
          if [[ "$EXPIRES_IN_ONE_WEEK" == "true" ]]; then
            [[ "$RELEASE_EPOCH" =~ ^[0-9]+$ ]]
            export BILIBILI_RELEASE_EPOCH="$RELEASE_EPOCH"
          fi

          export LYRA_BIN="$PWD/../lyra/target/release/lyra$EXE_EXT"

          mkdir -p ../dist/bin ../dist/assets
          bash tooling/build-lyra.sh "$TARGET" controller \
            "../dist/bin/controller$EXE_EXT"
          bash tooling/build-lyra.sh "$TARGET" worker \
            "../dist/bin/worker$EXE_EXT"

          tar -C ../dist/bin \
            -czf "../dist/assets/mewtype-${PLATFORM}-${VERSION}.tar.gz" \
            "controller$EXE_EXT" "worker$EXE_EXT"

      - uses: actions/upload-artifact@v5
        with:
          name: mewtype-${{ matrix.platform }}
          path: dist/assets/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: mewtype-publish-${{ needs.resolve.outputs.version }}
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      REVISION: ${{ needs.resolve.outputs.revision }}
      RELEASE_EPOCH: ${{ needs.resolve.outputs.release_epoch }}

    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: mewtype-*
          path: release-assets
          merge-multiple: true

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'Source commit: %s\n' "$REVISION"
            if [[ -n "$RELEASE_EPOCH" ]]; then
              printf '\nExpires at %s UTC.\n' \
                "$(date -u -d "@$((RELEASE_EPOCH + 604800))" '+%Y-%m-%d %H:%M:%S')"
            fi
          } > release-notes.md

      - name: Publish GitHub Release
        if: ${{ inputs.upload_target == 'release-only' || inputs.upload_target == 'both' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$VERSION" == nightly+* ]]; then
            flags+=(--prerelease)
          fi

          gh release create "$VERSION" release-assets/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Mewtype $VERSION" \
            --notes-file release-notes.md \
            "${flags[@]}"

      - name: Publish to Telegram
        if: ${{ inputs.upload_target == 'telegram-only' || inputs.upload_target == 'both' }}
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          : "${TELEGRAM_BOT_TOKEN:?Missing TELEGRAM_BOT_TOKEN}"
          : "${TELEGRAM_CHAT_ID:?Missing TELEGRAM_CHAT_ID}"

          api="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          message="$(printf 'Mewtype %s\n\n' "$VERSION"; cat release-notes.md)"

          curl --fail --silent --show-error \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$message" \
            "$api/sendMessage" | jq -e '.ok == true' >/dev/null

          for asset in release-assets/*.tar.gz; do
            curl --fail --silent --show-error \
              --form-string "chat_id=$TELEGRAM_CHAT_ID" \
              --form "document=@$asset" \
              "$api/sendDocument" | jq -e '.ok == true' >/dev/null
          done
